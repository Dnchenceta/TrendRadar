# ====================================================
# TrendRadar 主配置
# 用户：陈德宁
# ====================================================

# 应用版本检测
app:
  version_check_url: https://raw.githubusercontent.com/sansan0/TrendRadar/master/version

# ====================================================
# 平台配置
# ====================================================
platforms:
  enabled:
    - zhihu
    - weibo
    - baidu
    - toutiao
    - bilibili
    - douyin
    - wallstreet
    - thepaper
    - huxiu
    - sspai
    - juejin
    - csdn

# ====================================================
# RSS 自定义源
# ====================================================
rss:
  enabled: true
  feeds:
    - name: arXiv cs.AI
      url: http://export.arxiv.org/rss/cs.AI
      max_keep: 15
    - name: arXiv cs.LG
      url: http://export.arxiv.org/rss/cs.LG
      max_keep: 15
    - name: arXiv cs.HC
      url: http://export.arxiv.org/rss/cs.HC
      max_keep: 15
    - name: Anthropic News
      url: https://www.anthropic.com/news/rss.xml
      max_keep: 10
    - name: OpenAI Blog
      url: https://openai.com/blog/rss.xml
      max_keep: 10
    - name: Google DeepMind Blog
      url: https://deepmind.google/blog/rss.xml
      max_keep: 10
    - name: Hacker News Best
      url: https://hnrss.org/best
      max_keep: 15
    - name: 阮一峰的网络日志
      url: https://www.ruanyifeng.com/blog/atom.xml
      max_keep: 5

# ====================================================
# 关键词筛选
# ====================================================
frequency_words:
  enabled: true
  words_file: config/frequency_words.txt

# ====================================================
# 推送配置
# ====================================================
notification:
  feishu:
    enabled: true
    webhook_url: ${FEISHU_WEBHOOK_URL}
    at_mobiles: []
    at_all: false

  wechat_work:
    enabled: false
  dingtalk:
    enabled: false
  telegram:
    enabled: false
  email:
    enabled: false
  slack:
    enabled: false
  ntfy:
    enabled: false
  bark:
    enabled: false
  webhook:
    enabled: false

  push_window:
    enabled: true
    start: "09:00"
    end: "22:00"
    timezone: "Asia/Shanghai"

# ====================================================
# 报告展示
# ====================================================
report:
  mode: daily
  max_news_per_keyword: 5
  rank_threshold: 10000
  display_regions:
    - hotlist
    - rss
    - ai_analysis
  show_new_only: false

# ====================================================
# AI 分析（v5+ 功能）
# 暂不启用，先跑通基础推送
# ====================================================
ai_analysis:
  enabled: false
  llm_provider: openai
  api_key: ${AI_LLM_API_KEY}
  base_url: https://api.openai.com/v1
  model: gpt-4o-mini

# ====================================================
# 数据保留
# ====================================================
storage:
  retention_days: 30
  storage_backend: sqlite
